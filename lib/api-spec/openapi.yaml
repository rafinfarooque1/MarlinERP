openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Marlin Frozen Fruits ERP API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: materials
  - name: raw-materials
  - name: item-master
  - name: purchase
  - name: production
  - name: stock
  - name: warehouses
  - name: outlets
  - name: item-price
  - name: sales
  - name: hr-hierarchy
  - name: employees
  - name: payroll
  - name: attendance
  - name: leave
  - name: customers
  - name: vendors
  - name: coupons
  - name: accounts
  - name: expenses
  - name: gst
  - name: company
  - name: permissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with employee credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  # ── DASHBOARD ─────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Overall ERP dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/stock-alerts:
    get:
      operationId: getStockAlerts
      tags: [dashboard]
      summary: Low stock alerts across all branches
      responses:
        "200":
          description: Stock alerts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockAlert"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent system activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ── MATERIALS ─────────────────────────────────────────────────────────────
  /materials:
    get:
      operationId: listMaterials
      tags: [materials]
      summary: List all materials
      responses:
        "200":
          description: Materials list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
    post:
      operationId: createMaterial
      tags: [materials]
      summary: Create material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"

  /materials/{id}:
    get:
      operationId: getMaterial
      tags: [materials]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
    patch:
      operationId: updateMaterial
      tags: [materials]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
    delete:
      operationId: deleteMaterial
      tags: [materials]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  # ── RAW MATERIALS ─────────────────────────────────────────────────────────
  /raw-materials:
    get:
      operationId: listRawMaterials
      tags: [raw-materials]
      summary: List all raw materials
      responses:
        "200":
          description: Raw materials list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RawMaterial"
    post:
      operationId: createRawMaterial
      tags: [raw-materials]
      summary: Create raw material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterial"

  /raw-materials/{id}:
    get:
      operationId: getRawMaterial
      tags: [raw-materials]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Raw material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterial"
    patch:
      operationId: updateRawMaterial
      tags: [raw-materials]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterial"
    delete:
      operationId: deleteRawMaterial
      tags: [raw-materials]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  # ── ITEM MASTER ───────────────────────────────────────────────────────────
  /items:
    get:
      operationId: listItems
      tags: [item-master]
      summary: List all items in item master
      responses:
        "200":
          description: Items list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
    post:
      operationId: createItem
      tags: [item-master]
      summary: Create item in master
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"

  /items/{id}:
    get:
      operationId: getItem
      tags: [item-master]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
    patch:
      operationId: updateItem
      tags: [item-master]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
    delete:
      operationId: deleteItem
      tags: [item-master]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  # ── PURCHASE ──────────────────────────────────────────────────────────────
  /purchases:
    get:
      operationId: listPurchases
      tags: [purchase]
      summary: List all purchases (materials and raw materials)
      responses:
        "200":
          description: Purchases list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Purchase"
    post:
      operationId: createPurchase
      tags: [purchase]
      summary: Create purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"

  /purchases/{id}:
    get:
      operationId: getPurchase
      tags: [purchase]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"

  # ── PRODUCTION ────────────────────────────────────────────────────────────
  /productions:
    get:
      operationId: listProductions
      tags: [production]
      summary: List production batches
      responses:
        "200":
          description: Productions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Production"
    post:
      operationId: createProduction
      tags: [production]
      summary: Create production batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Production"

  /productions/{id}:
    get:
      operationId: getProduction
      tags: [production]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Production batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Production"

  # ── STOCK ─────────────────────────────────────────────────────────────────
  /stock:
    get:
      operationId: listStock
      tags: [stock]
      summary: List stock across all branches
      parameters:
        - { name: branchId, in: query, schema: { type: integer } }
        - { name: branchType, in: query, schema: { type: string, enum: [headoffice, warehouse, outlet] } }
      responses:
        "200":
          description: Stock list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockEntry"

  /stock/transfers:
    get:
      operationId: listStockTransfers
      tags: [stock]
      summary: List all stock transfers
      responses:
        "200":
          description: Stock transfers list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockTransfer"
    post:
      operationId: createStockTransfer
      tags: [stock]
      summary: Create stock transfer (with delivery challan)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockTransferInput"
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockTransfer"

  /stock/transfers/{id}:
    get:
      operationId: getStockTransfer
      tags: [stock]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Stock transfer with challan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockTransfer"

  # ── WAREHOUSES ────────────────────────────────────────────────────────────
  /warehouses:
    get:
      operationId: listWarehouses
      tags: [warehouses]
      summary: List all warehouses
      responses:
        "200":
          description: Warehouses list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Warehouse"
    post:
      operationId: createWarehouse
      tags: [warehouses]
      summary: Create warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"

  /warehouses/{id}:
    get:
      operationId: getWarehouse
      tags: [warehouses]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Warehouse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"
    patch:
      operationId: updateWarehouse
      tags: [warehouses]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"
    delete:
      operationId: deleteWarehouse
      tags: [warehouses]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  # ── OUTLETS ───────────────────────────────────────────────────────────────
  /outlets:
    get:
      operationId: listOutlets
      tags: [outlets]
      summary: List all outlets
      responses:
        "200":
          description: Outlets list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Outlet"
    post:
      operationId: createOutlet
      tags: [outlets]
      summary: Create outlet under warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutletInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outlet"

  /outlets/{id}:
    get:
      operationId: getOutlet
      tags: [outlets]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Outlet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outlet"
    patch:
      operationId: updateOutlet
      tags: [outlets]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutletUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outlet"
    delete:
      operationId: deleteOutlet
      tags: [outlets]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  # ── ITEM PRICE ────────────────────────────────────────────────────────────
  /item-prices:
    get:
      operationId: listItemPrices
      tags: [item-price]
      summary: List item prices (outlet-wise)
      parameters:
        - { name: outletId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Item prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemPrice"
    post:
      operationId: setItemPrice
      tags: [item-price]
      summary: Set or update outlet-wise item price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemPriceInput"
      responses:
        "200":
          description: Price set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPrice"

  # ── SALES ─────────────────────────────────────────────────────────────────
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List all sales
      parameters:
        - { name: outletId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Sales list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [sales]
      summary: Create sale (auto-fills price from outlet price)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/{id}:
    get:
      operationId: getSale
      tags: [sales]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/summary:
    get:
      operationId: getSalesSummary
      tags: [sales]
      summary: Sales summary grouped by outlet/warehouse
      responses:
        "200":
          description: Sales summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesSummary"

  # ── HR HIERARCHY ──────────────────────────────────────────────────────────
  /hr/hierarchies:
    get:
      operationId: listHierarchies
      tags: [hr-hierarchy]
      summary: List HR hierarchies / designations
      responses:
        "200":
          description: Hierarchies list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hierarchy"
    post:
      operationId: createHierarchy
      tags: [hr-hierarchy]
      summary: Create hierarchy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HierarchyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hierarchy"

  /hr/hierarchies/{id}:
    patch:
      operationId: updateHierarchy
      tags: [hr-hierarchy]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HierarchyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hierarchy"
    delete:
      operationId: deleteHierarchy
      tags: [hr-hierarchy]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  # ── EMPLOYEES ─────────────────────────────────────────────────────────────
  /hr/employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List all employees
      responses:
        "200":
          description: Employees list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /hr/employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    patch:
      operationId: updateEmployee
      tags: [employees]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  # ── PAYROLL ───────────────────────────────────────────────────────────────
  /hr/payroll:
    get:
      operationId: listPayroll
      tags: [payroll]
      summary: List monthly payroll records
      parameters:
        - { name: month, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: branchId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Payroll list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollRecord"

  /hr/payroll/{id}/pay:
    post:
      operationId: markPayrollPaid
      tags: [payroll]
      summary: Mark payroll record as paid
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Marked paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRecord"

  # ── ATTENDANCE ────────────────────────────────────────────────────────────
  /hr/attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List attendance records
      parameters:
        - { name: employeeId, in: query, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string } }
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"

  /hr/attendance/check-in:
    post:
      operationId: checkIn
      tags: [attendance]
      summary: Employee check-in with location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  /hr/attendance/check-out:
    post:
      operationId: checkOut
      tags: [attendance]
      summary: Employee check-out with location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "200":
          description: Checked out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  # ── LEAVE ─────────────────────────────────────────────────────────────────
  /hr/leaves:
    get:
      operationId: listLeaves
      tags: [leave]
      summary: List leave applications
      parameters:
        - { name: employeeId, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
      responses:
        "200":
          description: Leave applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveApplication"
    post:
      operationId: applyLeave
      tags: [leave]
      summary: Apply for leave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveInput"

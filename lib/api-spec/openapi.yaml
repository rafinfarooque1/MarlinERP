components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # AUTH
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, employee]
      properties:
        token:
          type: string
        employee:
          $ref: "#/components/schemas/Employee"

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string

    # DASHBOARD
    DashboardSummary:
      type: object
      properties:
        totalItemsProduced:
          type: integer
        totalSalesAmount:
          type: number
        totalStockValue:
          type: number
        activeEmployees:
          type: integer
        pendingTransfers:
          type: integer
        todayAttendance:
          type: integer
        pendingLeaves:
          type: integer
        lowStockCount:
          type: integer
        totalExpense:
          type: number
        totalBatchesCreated:
          type: integer
        totalBatchQuantity:
          type: number
        bankBalance:
          type: number
        cashBalance:
          type: number

    StockAlert:
      type: object
      properties:
        itemId:
          type: integer
        itemName:
          type: string
        branchName:
          type: string
        branchType:
          type: string
        quantity:
          type: number

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        user:
          type: string
        timestamp:
          type: string

    # MATERIAL
    Material:
      type: object
      required: [id, name, unit, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        unit:
          type: string
        description:
          type: ["string", "null"]
        currentStock:
          type: number
        createdAt:
          type: string

    MaterialInput:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
        unit:
          type: string
        description:
          type: string

    MaterialUpdate:
      type: object
      properties:
        name:
          type: string
        unit:
          type: string
        description:
          type: string

    # RAW MATERIAL
    RawMaterial:
      type: object
      required: [id, name, unit, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        unit:
          type: string
        description:
          type: ["string", "null"]
        currentStock:
          type: number
        createdAt:
          type: string

    RawMaterialInput:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
        unit:
          type: string
        description:
          type: string

    RawMaterialUpdate:
      type: object
      properties:
        name:
          type: string
        unit:
          type: string
        description:
          type: string

    # ITEM MASTER
    Item:
      type: object
      required: [id, name, hsnCode, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        hsnCode:
          type: string
        taxRate:
          type: number
        unit:
          type: string
        description:
          type: ["string", "null"]
        productionStock:
          type: number
        createdAt:
          type: string

    ItemInput:
      type: object
      required: [name, hsnCode, unit]
      properties:
        name:
          type: string
        hsnCode:
          type: string
        taxRate:
          type: number
        unit:
          type: string
        description:
          type: string

    ItemUpdate:
      type: object
      properties:
        name:
          type: string
        hsnCode:
          type: string
        taxRate:
          type: number
        unit:
          type: string
        description:
          type: string

    # PURCHASE
    PurchaseLineItem:
      type: object
      required: [materialType, materialId, quantity, unitCost]
      properties:
        materialType:
          type: string
          enum: [material, raw_material, item]
        materialId:
          type: integer
        quantity:
          type: number
        unitCost:
          type: number
          description: >-
            Rate as keyed in. Whether it includes GST is decided by the bill's
            priceMode, never inferred from the amount.
        hsnCode:
          type: string
          description: >-
            Snapshot of the product's HSN at the time of the bill. Defaults from
            the Item Master when omitted. A string, so leading zeros survive.
        discount:
          type: number
          description: Line discount as a percentage of qty x rate.
        gstRate:
          type: number
          description: >-
            GST slab for this line (0/5/12/18/28). Defaults from the Item Master
            when omitted; snapshotted onto the bill, never written back.
        taxType:
          type: string
          enum: [intra, inter]
          description: >-
            Supply type. The server derives this from the vendor and receiving
            location states and its value wins unless taxTypeOverride is set.
        taxTypeOverride:
          type: boolean
          description: Keep the supplied taxType even when the server derives a different one.
        batchNumber:
          type: string
          description: >-
            Leave blank to have a unique PUR-YYYYMMDD-NNNNN number issued by the
            server. A supplied number is checked for collisions.
        mfgDate:
          type: string
        expiryDate:
          type: string

    Purchase:
      type: object
      required: [id, vendorId, purchaseDate, lineItems, totalAmount, createdAt]
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        vendorName:
          type: string
        purchaseDate:
          type: string
        invoiceNumber:
          type: ["string", "null"]
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseLineItem"
        otherCharges:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOtherCharge"
        otherChargesTotal:
          type: number
        totalAmount:
          type: number
        taxTotal:
          type: number
        discountTotal:
          type: number
        roundOff:
          type: number
        priceMode:
          type: string
          enum: [exclusive, inclusive]
        locationType:
          type: string
        locationId:
          type: integer
        locationName:
          type: string
        warnings:
          type: array
          items:
            type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    PurchaseInput:
      type: object
      required: [vendorId, purchaseDate, lineItems]
      properties:
        vendorId:
          type: integer
        purchaseDate:
          type: string
        invoiceNumber:
          type: string
        priceMode:
          type: string
          enum: [exclusive, inclusive]
          description: >-
            Whether the line rates were keyed inclusive or exclusive of GST.
            Stored with the bill; defaults to exclusive.
        locationType:
          type: string
          enum: [headoffice, warehouse, outlet]
          description: >-
            Requested receiving location. Only honoured if the caller's own
            location scope allows it; otherwise the session's location is used.
        locationId:
          type: integer
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseLineItem"
        otherCharges:
          type: array
          description: >-
            Incidental purchase expenses (freight, hamali, courier…) posted
            straight to the chosen expense ledgers in P&L. Never part of
            inventory cost or line GST — the vendor is credited the bill
            total plus these charges.
          items:
            $ref: "#/components/schemas/PurchaseOtherCharge"
        notes:
          type: string

    PurchaseOtherCharge:
      type: object
      required: [ledgerId, amount]
      properties:
        ledgerId:
          type: integer
          description: A postable expense ledger from the Chart of Accounts.
        ledgerName:
          type: string
          description: Server-enriched on reads; ignored on writes.
        amount:
          type: number

    # PRODUCTION
    ProductionLineItem:
      type: object
      properties:
        materialType:
          type: string
          enum: [material, raw_material]
        materialId:
          type: integer
        usedQuantity:
          type: number

    Production:
      type: object
      required: [id, itemId, producedQuantity, productionDate, createdAt]
      properties:
        id:
          type: integer
        itemId:
          type: integer
        itemName:
          type: string
        producedQuantity:
          type: number
        productionDate:
          type: string
        materialUsed:
          type: array
          items:
            $ref: "#/components/schemas/ProductionLineItem"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    ProductionInput:
      type: object
      required: [itemId, producedQuantity, productionDate, materialUsed]
      properties:
        itemId:
          type: integer
        producedQuantity:
          type: number
        productionDate:
          type: string
        materialUsed:
          type: array
          items:
            $ref: "#/components/schemas/ProductionLineItem"
        notes:
          type: string

    # STOCK
    StockEntry:
      type: object
      properties:
        id:
          type: integer
        itemId:
          type: integer
        itemName:
          type: string
        hsnCode:
          type: string
        branchType:
          type: string
          enum: [headoffice, warehouse, outlet]
        branchId:
          type: integer
        branchName:
          type: string

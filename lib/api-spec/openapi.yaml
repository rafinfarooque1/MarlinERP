    # SALES
    SaleLineItem:
      type: object
      required: [itemId, quantity]
      properties:
        itemId:
          type: integer
        quantity:
          type: number
        unitPrice:
          type: number
        discount:
          type: number
          description: >
            TOTAL pre-tax discount on the line in rupees. For historical lines
            this is the amount the cashier typed (deducted once from the line
            total). For lines written by the per-unit discount system it is the
            DERIVED sum unitDiscount×quantity + billDiscountShare, kept so every
            consumer that recomputes gross as qty×unitPrice−discount stays
            correct without knowing about the newer fields.
        unitDiscount:
          type: number
          description: >
            Discount per UNIT off the MRP, in rupees (0 ≤ unitDiscount ≤
            unitPrice). Present only on lines created since the per-unit
            discount system; absent on historical lines, whose 'discount' is a
            line-total amount and must not be reinterpreted.
        billDiscountShare:
          type: number
          description: >
            This line's paise-exact share of the invoice-level bill discount,
            allocated proportionally to the line's post-item-discount value.
            Shares across the invoice sum exactly to the sale's billDiscount.
        taxAmount:
          type: number
        priceMode:
          type: string
          enum: [inclusive, exclusive]
          description: >
            How the entered unitPrice is interpreted for THIS line.
            'inclusive' (default, and the treatment of every historical line):
            unitPrice is the final GST-inclusive price and GST is extracted
            from it. 'exclusive': unitPrice is the taxable base and GST is
            added on top. Mirrors the purchases priceMode convention, per line.

    Sale:
      type: object
      required: [id, outletId, saleDate, lineItems, totalAmount, createdAt]
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        outletId:
          type: integer
        outletName:
          type: string
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        saleDate:
          type: string
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/SaleLineItem"
        subtotal:
          type: number
        taxTotal:
          type: number
        discountTotal:
          type: number
        billDiscount:
          type: number
          description: >
            Invoice-level discount in rupees, applied BEFORE tax: allocated
            proportionally across lines, reducing each line's taxable value and
            GST. Distinct from discountTotal (the post-tax coupon deduction).
        totalAmount:
          type: number
        paymentMode:
          type: string
        couponCode:
          type: ["string", "null"]
        createdAt:
          type: string
        quotationId:
          type: ["integer", "null"]
          description: Set when this sale was converted from a quotation.
        quotationNumber:
          type: ["string", "null"]
          description: The quotation this sale was converted from (QTN/…).

    SaleInput:
      type: object
      required: [outletId, saleDate, lineItems, paymentMode]
      properties:

          type: integer
        customerId:
          type: integer
        saleDate:
          type: string
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/SaleLineItem"
        paymentMode:
          type: string
        couponCode:
          type: string
        billDiscount:
          type: number
          description: Pre-tax invoice-level discount, allocated across lines.
        quotationId:
          type: integer
          description: >
            When present, completing this sale converts the quotation: inside
            the sale transaction the quotation row is locked, a second
            conversion is refused, and the two documents are stamped with each
            other's numbers. Exactly one sale can ever result from a quotation.


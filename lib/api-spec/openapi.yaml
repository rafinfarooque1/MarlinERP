        totalSales:
          type: number
        totalTaxCollected:
          type: number
        totalPurchases:
          type: number
        totalTaxPaid:
          type: number
        netGstLiability:
          type: number
        byWarehouse:
          type: array
          items:
            type: object
            properties:
              warehouseId: { type: integer }
              warehouseName: { type: string }
              gstNumber: { type: string }
              salesTax: { type: number }
              purchaseTax: { type: number }


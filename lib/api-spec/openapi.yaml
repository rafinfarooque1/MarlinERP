components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # AUTH
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, employee]
      properties:
        token:
          type: string
        employee:
          $ref: "#/components/schemas/Employee"

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string

    # DASHBOARD
    DashboardSummary:
      type: object
      properties:
        totalItemsProduced:
          type: integer
        totalSalesAmount:
          type: number
        totalStockValue:
          type: number
        activeEmployees:
          type: integer
        pendingTransfers:
          type: integer
        todayAttendance:
          type: integer
        pendingLeaves:
          type: integer
        lowStockCount:
          type: integer
        totalExpense:
          type: number
        totalBatchesCreated:
          type: integer
        totalBatchQuantity:
          type: number
        bankBalance:
          type: number
        cashBalance:
          type: number

    StockAlert:
      type: object
      properties:
        itemId:
          type: integer
        itemName:
          type: string
        branchName:
          type: string
        branchType:
          type: string
        quantity:
          type: number

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        user:
          type: string
        timestamp:
          type: string

    # MATERIAL
    Material:
      type: object
      required: [id, name, unit, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        unit:
          type: string
        description:
          type: ["string", "null"]
        currentStock:
          type: number
        createdAt:
          type: string

    MaterialInput:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
        unit:
          type: string
        description:
          type: string

    MaterialUpdate:
      type: object
      properties:
        name:
          type: string
        unit:
          type: string
        description:
          type: string

    # RAW MATERIAL
    RawMaterial:
      type: object
      required: [id, name, unit, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        unit:
          type: string
        description:
          type: ["string", "null"]
        currentStock:
          type: number
        createdAt:
          type: string

    RawMaterialInput:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
        unit:
          type: string
        description:
          type: string

    RawMaterialUpdate:
      type: object
      properties:
        name:
          type: string
        unit:
          type: string
        description:
          type: string

    # ITEM MASTER
    Item:
      type: object
      required: [id, name, hsnCode, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        hsnCode:
          type: string
        taxRate:
          type: number
        unit:
          type: string
        description:
          type: ["string", "null"]
        productionStock:
          type: number
        createdAt:
          type: string

    ItemInput:
      type: object
      required: [name, hsnCode, unit]
      properties:
        name:
          type: string
        hsnCode:
          type: string
        taxRate:
          type: number
        unit:
          type: string
        description:
          type: string

    ItemUpdate:
      type: object
      properties:
        name:
          type: string
        hsnCode:
          type: string
        taxRate:
          type: number
        unit:
          type: string
        description:
          type: string

    # PURCHASE
    PurchaseLineItem:
      type: object
      required: [materialType, materialId, quantity, unitCost]
      properties:
        materialType:
          type: string
          enum: [material, raw_material, item]
        materialId:
          type: integer
        quantity:
          type: number
        unitCost:
          type: number
        batchNumber:
          type: string
        mfgDate:
          type: string
        expiryDate:
          type: string

    Purchase:
      type: object
      required: [id, vendorId, purchaseDate, lineItems, totalAmount, createdAt]
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        vendorName:
          type: string
        purchaseDate:
          type: string
        invoiceNumber:
          type: ["string", "null"]
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseLineItem"
        totalAmount:
          type: number
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    PurchaseInput:
      type: object
      required: [vendorId, purchaseDate, lineItems]
      properties:
        vendorId:
          type: integer
        purchaseDate:
          type: string
        invoiceNumber:
          type: string
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseLineItem"
        notes:
          type: string

    # PRODUCTION
    ProductionLineItem:
      type: object
      properties:
        materialType:
          type: string
          enum: [material, raw_material]
        materialId:
          type: integer
        usedQuantity:
          type: number

    Production:
      type: object
      required: [id, itemId, producedQuantity, productionDate, createdAt]
      properties:
        id:
          type: integer
        itemId:
          type: integer
        itemName:
          type: string
        producedQuantity:
          type: number
        productionDate:
          type: string
        materialUsed:
          type: array
          items:
            $ref: "#/components/schemas/ProductionLineItem"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    ProductionInput:
      type: object
      required: [itemId, producedQuantity, productionDate, materialUsed]
      properties:
        itemId:
          type: integer
        producedQuantity:
          type: number
        productionDate:
          type: string
        materialUsed:
          type: array
          items:
            $ref: "#/components/schemas/ProductionLineItem"
        notes:
          type: string

    # STOCK
    StockEntry:
      type: object
      properties:
        id:
          type: integer
        itemId:
          type: integer
        itemName:
          type: string
        hsnCode:
          type: string
        branchType:
          type: string
          enum: [headoffice, warehouse, outlet]
        branchId:
          type: integer
        branchName:
          type: string
        quantity:
          type: number
        costPrice:
          type: number
        unit:
          type: string

    StockTransferLine:
      type: object
      required: [itemId, quantity]
      properties:
        itemId:
          type: integer
        quantity:
          type: number
          exclusiveMinimum: 0
        costPrice:
          type: number

    StockTransfer:
      type: object
      required: [id, fromType, fromId, toType, toId, transferDate, lineItems, createdAt]
      properties:
        id:
          type: integer
        challanNumber:
          type: string
        fromType:
          type: string
          enum: [headoffice, warehouse, outlet]
        fromId:
          type: integer
        fromName:
          type: string
        toType:
          type: string
          enum: [headoffice, warehouse, outlet]
        toId:
          type: integer
        toName:
          type: string
        transferDate:
          type: string
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/StockTransferLine"
        isInterstate:
          type: boolean
        status:
          type: string
          enum: [pending, in_transit, completed, rejected, cancelled]
        createdAt:
          type: string

    StockTransferInput:
      type: object
      required: [fromType, fromId, toType, toId, transferDate, lineItems]
      properties:
        fromType:
          type: string
          enum: [headoffice, warehouse, outlet]
        fromId:
          type: integer
        toType:
          type: string
          enum: [headoffice, warehouse, outlet]
        toId:
          type: integer
        transferDate:
          type: string
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/StockTransferLine"
        notes:
          type: string

    # WAREHOUSE
    Warehouse:
      type: object
      required: [id, name, state, gstNumber, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        state:
          type: string
        gstNumber:
          type: string
        address:
          type: ["string", "null"]
        contactPerson:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        outletCount:
          type: integer
        createdAt:
          type: string

    WarehouseInput:
      type: object
      required: [name, state, gstNumber]
      properties:
        name:
          type: string
        state:
          type: string
        gstNumber:
          type: string
        address:
          type: string
        contactPerson:
          type: string
        phone:
          type: string

    WarehouseUpdate:
      type: object
      properties:
        name:
          type: string
        state:
          type: string
        gstNumber:
          type: string
        address:
          type: string
        contactPerson:
          type: string
        phone:
          type: string

    # OUTLET
    Outlet:
      type: object
      required: [id, name, warehouseId, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        warehouseId:
          type: integer
        warehouseName:
          type: string
        address:
          type: ["string", "null"]
        contactPerson:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        createdAt:
          type: string

    OutletInput:
      type: object
      required: [name, warehouseId]
      properties:
        name:
          type: string
        warehouseId:
          type: integer
        address:
          type: string
        contactPerson:
          type: string
        phone:
          type: string

    OutletUpdate:
      type: object
      properties:
        name:
          type: string
        warehouseId:
          type: integer
        address:
          type: string
        contactPerson:
          type: string
        phone:
          type: string

    # ITEM PRICE
    ItemPrice:
      type: object
      properties:
        id:
          type: integer
        itemId:
          type: integer
        itemName:
          type: string
        outletId:
          type: integer
        outletName:
          type: string
        price:
          type: number
        updatedAt:
          type: string

    ItemPriceInput:
      type: object
      required: [itemId, outletId, price]
      properties:
        itemId:
          type: integer
        outletId:
          type: integer
        price:
          type: number

    # SALES
    SaleLineItem:
      type: object
      required: [itemId, quantity]
      properties:
        itemId:
          type: integer
        quantity:
          type: number
        unitPrice:
          type: number
        discount:
          type: number
        taxAmount:
          type: number

    Sale:
      type: object
      required: [id, outletId, saleDate, lineItems, totalAmount, createdAt]
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        outletId:
          type: integer
        outletName:
          type: string
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        saleDate:
          type: string
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/SaleLineItem"
        subtotal:
          type: number
        taxTotal:
          type: number
        discountTotal:
          type: number
        totalAmount:
          type: number
        paymentMode:
          type: string
        couponCode:
          type: ["string", "null"]
        createdAt:
          type: string

    SaleInput:
      type: object
      required: [outletId, saleDate, lineItems, paymentMode]
      properties:
        outletId:
          type: integer
        customerId:
          type: integer
        saleDate:
          type: string
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/SaleLineItem"
        paymentMode:
          type: string
        couponCode:
          type: string

    SalesSummary:
      type: object
      properties:
        totalSales:
          type: number
        totalTax:
          type: number
        totalInvoices:
          type: integer
        byOutlet:
          type: array
          items:
            type: object
            properties:
              outletId: { type: integer }
              outletName: { type: string }
              salesAmount: { type: number }
              invoiceCount: { type: integer }

    # HR
    Hierarchy:
      type: object
      required: [id, name, level]
      properties:
        id:
          type: integer
        name:
          type: string
        level:
          type: integer
        description:
          type: ["string", "null"]

    HierarchyInput:
      type: object
      required: [name, level]
      properties:
        name:
          type: string
        level:
          type: integer
        description:
          type: string

    HierarchyUpdate:
      type: object
      properties:
        name:
          type: string
        level:
          type: integer
        description:
          type: string

    Employee:
      type: object
      required: [id, name, username, hierarchyId, branchType, branchId]
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        hierarchyId:
          type: integer
        hierarchyName:
          type: string

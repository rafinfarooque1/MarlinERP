          type: integer
        name:
          type: string
        accountType:
          type: string
          enum: [cash, bank, upi, other]
        bankName:
          type: ["string", "null"]
        accountNumber:
          type: ["string", "null"]
          description: Always a string — leading zeros are significant and real account numbers exceed the safe integer range.
        ifscCode:
          type: ["string", "null"]
        balance:
          type: number
          description: >-
            The account's reconciled balance, derived from the posting stream
            plus opening balances — the same figure the Cash/Bank Book, Trial
            Balance and Balance Sheet show.
        storedBalance:
          type: number
          description: >-
            Legacy stored column, no longer maintained. Kept for existing
            consumers only.
        currentBalance:
          type: ["number", "null"]
          description: >-
            Reconciled balance from the posting stream, or null when no ledger
            backs this account. Null renders as an explicit gap rather than a
            confident number.
        balanceSource:
          type: string
          enum: [unlinked, ledger]
        ledgerId:
          type: ["integer", "null"]
        locationType:
          type: ["string", "null"]
          description: headoffice, warehouse or outlet — the ONE location this account belongs to.
        locationId:
          type: ["integer", "null"]
        locationName:
          type: ["string", "null"]
        source:
          type: string
          enum: [module, location, system, ledger]
          description: >-
            module = managed on this screen; location = a branch till owned by
            the Locations module (read-only here); system = the Cash / Bank
            Accounts head itself; ledger = another ledger in the subtree.
        readOnly:
          type: boolean
        requiresReconciliation:
          type: boolean
          description: >-
            Bank/UPI accounts only. When true, collections routed into this
            account land in Electronic Clearing first and reach the bank
            balance through Reconciliation; when false, they post straight
            into the account's ledger.

    CashBankInput:
      type: object
      required: [name, accountType]
      properties:
        name:
          type: string
        accountType:
          type: string
          enum: [cash, bank, upi, other]
        bankName:
          type: string
        accountNumber:
          type: string
        ifscCode:
          type: string
        locationType:
          type: string
          enum: [headoffice, warehouse, outlet]
          description: Defaults to headoffice.
        locationId:
          type: integer
          description: Required when locationType is warehouse or outlet.
        openingBalance:
          type: number
          description: >-
            Recorded as the backing ledger's opening balance (debit) through
            the opening-balances store — never a stored column. Absent or
            blank means 0.
        requiresReconciliation:
          type: boolean
          description: >-
            Bank/UPI accounts only — whether collections into this account
            must pass through Reconciliation before hitting the bank balance.
            Defaults to true for bank/UPI/other, ignored for cash.

    CashBankUpdate:
      type: object
      properties:
        name:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        ifscCode:
          type: string
        locationType:
          type: string
          enum: [headoffice, warehouse, outlet]
        locationId:
          type: integer
        openingBalance:
          type: number
          description: Replaces the ledger's opening balance for the current financial year.
        requiresReconciliation:
          type: boolean
          description: Bank/UPI accounts only — toggle the reconciliation requirement.

    Expense:
      type: object
      required: [id, ledgerAccountId, amount, expenseDate]
      properties:
        id:
          type: integer
        ledgerAccountId:
          type: integer
        ledgerAccountName:
          type: string
        paymentAccountId:
          type: integer
        paymentAccountName:
          type: string
        amount:
          type: number
        expenseDate:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string

    ExpenseInput:
      type: object
      required: [ledgerAccountId, paymentAccountId, amount, expenseDate]
      properties:
        ledgerAccountId:
          type: integer
        paymentAccountId:
          type: integer
        amount:
          type: number
        expenseDate:
          type: string
        description:
          type: string

    GstSummary:

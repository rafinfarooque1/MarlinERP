kind = "mobile"
previewPath = "/employee-app/"
title = "Frozen Fruits Employee App"
version = "1.0.0"
id = "artifacts/employee-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/employee-app/" ]
localPort = 25991

[services.development]
run = "pnpm --filter @workspace/employee-app run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/employee-app", "run", "build"]

[services.production.build.env]
EXPO_PUBLIC_DOMAIN = "frozenfruits.store"
NODE_ENV = "production"
CI = "1"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/employee-app", "run", "serve"]

[services.production.run.env]
PORT = "25991"
BASE_PATH = "/employee-app/"
NODE_ENV = "production"

[services.production.health.startup]
path = "/employee-app/"

[services.env]
PORT = "25991"
BASE_PATH = "/employee-app/"
